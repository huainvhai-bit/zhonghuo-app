name: 安心助手
options:
  bundleIdPrefix: com.zhonghuo
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: 16.0
  groupSortPosition: top
  fileNaming: oghub
  generateEmptyDirectories: true
  postGenCommand: cd .. && rm -rf DerivedData/安心助手-*
settings:
  base:
    PRODUCT_NAME: 安心助手
    PRODUCT_BUNDLE_IDENTIFIER: com.zhonghuo.app
    MARKETING_VERSION: 2.0.1
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_FILE: Info.plist
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    TARGETED_DEVICE_FAMILY: 1,2
    IOS_DEPLOYMENT_TARGET: 15.0
    SWIFT_VERSION: "5.9"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_PREVIEWS: "YES"
    GENERATE_STRING_CATALOGS: "YES"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    SWIFT_TREAT_AS_ERROR_CONCURRENCY_VIOLATIONS: "NO"
    GCC_OPTIMIZATION_LEVEL: 0
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    MTL_ENABLE_DEBUG_INFO: "INCLUDE_SOURCE"
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    OTHER_LDFLAGS:
      - $(inherited)
      - -lresolv
    GCC_PREPROCESSOR_DEFINITIONS:
      - DEBUG=1
      - $(inherited)
targets:
  安心助手:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Core
      - path: Models
      - path: Assets.xcassets
      - path: Info.plist
      - path: AppDelegate.swift
    info:
      path: Info.plist
      properties:
        CFBundleName: 安心助手
        CFBundleDisplayName: 安心助手
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleSignature: ????
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSRequiresIPhoneOS: YES
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 本应用需要使用摄像头扫描邀请码，以便双方确认后添加用户
        NSUserNotificationUsageDescription: 本应用需要发送本机通知提醒您更新签到记录
        UIUserNotificationSettings:
          UIUserNotificationType:
            - UIUserNotificationTypeAlert
            - UIUserNotificationTypeBadge
            - UIUserNotificationTypeSound
        UISupportsDocumentBrowser: YES
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: YES
        ITSAppUsesNonExemptEncryption: NO
        NSPhotoLibraryUsageDescription: 本应用需要访问相册以保存您的留言内容
        NSMicrophoneUsageDescription: 本应用需要访问麦克风以录制语音留言
        NSMotionUsageDescription: 本应用需要访问运动数据以展示设备状态
        NSPhotoLibraryAddUsageDescription: 本应用需要保存到相册以保存您的留言内容
        BGTaskSchedulerPermittedIdentifiers:
          - com.zhonghuo.app.refresh_notifications
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            "zhonghuo.zhonghuo.xyz":
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon
    preBuildScripts: []
