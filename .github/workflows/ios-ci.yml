name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        xcodebuild -project 终活.xcodeproj \
          -scheme 终活 \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          build
    
    - name: Run Tests
      run: |
        xcodebuild test -project 终活.xcodeproj \
          -scheme 终活 \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
